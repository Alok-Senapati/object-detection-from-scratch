name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --locked --extra cpu
      - run: uv run --no-sync python scripts/check.py
      - run: uv run --no-sync od-diagnose
      - run: uv run --no-sync od-smoke
